# Deploys pki.sgit.ai (this repo's working tree) to GitHub Pages, with the same
# pipeline order as SGit-AI/SGit-AI__Website and SGit-AI/SGit-AI__Website__NHI:
# validate → tag → publish.
#
#   1. validate     — the pre-release gate (structure, internal links, version
#                     agreement, canonical/CNAME agreement, key-leak tripwire).
#                     A failure stops the release: no tag, no publish. It also
#                     runs on pull requests, so branch work is gated before it
#                     ever reaches the release branch.
#   2. tag-release  — every push to dev is a minor release and ends tagged
#                     v{release}.{major}.{minor}. The version is owned by
#                     admin/build/version.txt (bumped exactly once per release)
#                     and must also appear in the release commit's subject
#                     ("site vX.Y.Z: ..."). CI verifies the two agree and that
#                     the bump is the next minor (or a deliberate major), then
#                     tags. First run backfills tags for any historical release
#                     from the commit subjects.
#   3. deploy       — publishes the tagged commit. Runs on manual dispatch even
#                     without a tag, but never when validation failed.
name: deploy-pages
on:
  push:
    # dev is the release branch: validate -> tag -> deploy. A push to main is
    # deploy-only (tag-release skips), so main can serve as a deploy test or
    # fallback while the github-pages environment still restricts dev.
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate the site (structure, links, version, canonical, key-leak tripwire)
        run: node admin/build/validate.js

  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this release (and backfill any missing historical tags)
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          git config user.name  'GitHub Actions'
          git config user.email 'actions@github.com'

          # Backfill: every release commit carries its version in the subject
          # ("site vR.M.N: ..."). Tag any that are missing — idempotent, so this
          # is a no-op on every run after the first.
          git log --format='%H;%s' | while IFS=';' read -r h s; do
            v=$(printf '%s' "$s" | grep -oP '^site v\K[0-9]+\.[0-9]+\.[0-9]+(?=:)' || true)
            if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git tag "v$v" "$h"
              echo "backfilled v$v -> ${h:0:9}"
            fi
          done

          # The version of THIS release, from the file that owns it.
          VER=$(grep -oP '^v\K[0-9]+\.[0-9]+\.[0-9]+' admin/build/version.txt)
          TAG="v$VER"
          echo "version.txt says $TAG"

          # The release commit's subject must agree (the backfill above tags it).
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::HEAD's subject does not carry $TAG — version.txt and the release commit disagree"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG already exists on another commit — version.txt was not bumped for this release"
            exit 1
          fi

          # Every push to dev is a minor: the new tag must be the next minor
          # after the previous latest (or a deliberate major/release bump to .0).
          # `|| true` catches the very first release, where grep -v empties the
          # pipe and would otherwise kill the job under pipefail.
          PREV=$(git tag --list 'v*' | grep -v "^$TAG$" | sort -V | tail -1 || true)
          if [ -n "$PREV" ]; then
            NEXT_MINOR=$(echo "$PREV" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            NEXT_MAJOR=$(echo "$PREV" | awk -F. '{split($1,a,"v"); printf "v%s.%d.0", a[2], $2+1}')
            if [ "$TAG" != "$NEXT_MINOR" ] && [ "$TAG" != "$NEXT_MAJOR" ]; then
              echo "::error::latest tag is $PREV; expected $NEXT_MINOR (minor) or $NEXT_MAJOR (major), got $TAG"
              exit 1
            fi
          fi

          # The load-bearing push: THIS release's tag, at HEAD.
          git push origin "refs/tags/$TAG"
          echo "tagged HEAD as $TAG"

          # Best-effort: the backfilled historical tags. GITHUB_TOKEN cannot
          # push a ref to a commit whose tree carries a DIFFERENT
          # .github/workflows blob, so releases predating a workflow change may
          # be rejected. Push what is accepted, report what is not.
          MISSED=0
          for t in $(git tag --list 'v*'); do
            [ "$t" = "$TAG" ] && continue
            if git push origin "refs/tags/$t" >/dev/null 2>&1; then
              echo "backfill ok: $t"
            else
              echo "::warning::could not push backfill tag $t (GITHUB_TOKEN workflow-file limit)"
              MISSED=$((MISSED+1))
            fi
          done
          if [ "$MISSED" -gt 0 ]; then
            echo "::notice::$MISSED historical tag(s) still need a human push: git push origin --tags"
          fi
          true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, tag-release]
    # Publish even when tag-release is skipped (manual dispatch) — never when
    # validation failed, and never from a pull request.
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site artifact
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
