# Deploys pki.sgit.ai (this repo's working tree) to GitHub Pages. CI owns the version
# (https://newsroom.sgit.ai/articles/ci-owns-the-version.html), as on web-summit.sgit.ai and
# newsroom.sgit.ai: nobody who pushes writes a number.
#
#   1. validate — the gate, on the pushed commit and on pull requests: structure, internal links,
#                 version agreement, canonical/CNAME, key-leak tripwire, the register and its tests.
#                 PKI_PENDING_RELEASE=1: lib/ may trail assets/people, since the release makes it.
#                 A failure stops everything.
#   2. release  — on a push to dev, one at a time (concurrency group "release", never cancelled):
#                 admin/build/tag_release.sh takes dev's head as it is now, bumps the last number
#                 of the newest version, writes version.txt and the versions row, stamps the chrome,
#                 releases lib/ (signed when the PKI_AGENT_KEY secret is set), runs the gate on that
#                 tree, commits as GitHub Actions ("site vX.Y.Z: <the pushed subject>"), tags it and
#                 pushes; then deploys exactly that tree. A pending run that is dropped is harmless:
#                 its commits ride the next release.
#   3. deploy   — a push to main, or a manual dispatch: deploys the tree as it is, no number.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate the site (structure, links, version, canonical, key-leak tripwire)
        run: node admin/build/validate.js
        env:
          PKI_PENDING_RELEASE: '1'
      - name: The register of people (keys and records; vaults against the mock server)
        run: node admin/build/test_people.mjs && node admin/build/test_people_vault.mjs && node admin/build/test_agent_tool.mjs

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    # Never from a PR, only dev. One release at a time; a pending run may be dropped, which is harmless.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Number, stamp, release lib, check, commit and tag this release (CI owns the version)
        env:
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          # the site agent's key, one line from `node agents/pki-agent.mjs keyfile`: signs lib manifests when set
          PKI_AGENT_KEY: ${{ secrets.PKI_AGENT_KEY }}
        run: admin/build/tag_release.sh
      - name: Assemble the site artifact (the tree just released and checked)
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    # main (a deploy test or fallback) and manual dispatch: the tree as it is, no number
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site artifact
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
