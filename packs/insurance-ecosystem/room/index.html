    pols.map(p => `policy ${esc(p.id)} · <span class="mono">sha256 ${esc(p.sha256)}</span>`).join('<br>') +
    `<br>Part of the <a href="../index.html">insurance ecosystem pack</a> on pki.sgit.ai. This room reads; it never writes. A decision is a file the approver writes; the room shows it on the next maintainer run. There is no insurer.`;
  ready();
}
build().catch(e => { document.getElementById('grid').innerHTML = '<p class="err">' + esc(e && e.message) + '</p>'; ready(); });
</script>
</body>
</html>
